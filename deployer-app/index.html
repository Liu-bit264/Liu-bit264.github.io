<!doctype html>
<html lang="zh-cn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文章部署器</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 24px;
        background: #18181b;
        color: #fafafa;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      .muted {
        color: #a1a1aa;
        font-size: 13px;
      }
      button {
        padding: 8px 16px;
        border-radius: 8px;
        border: 1px solid #52525b;
        cursor: pointer;
        background: #27272a;
        color: #fafafa;
        font-size: 14px;
      }
      button:hover {
        background: #3f3f46;
      }
      button.primary {
        background: #2563eb;
        color: #fff;
        border: none;
      }
      button.primary:hover {
        background: #1d4ed8;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .post {
        border: 1px solid #3f3f46;
        border-radius: 10px;
        padding: 12px 16px;
        margin: 10px 0;
        background: #1f1f23;
      }
      .post h3 {
        margin: 0 0 6px;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .meta {
        font-size: 12px;
        color: #a1a1aa;
        margin-bottom: 4px;
      }
      .imgs {
        font-size: 12px;
        color: #888;
      }
      .img-ok {
        color: #4ade80;
      }
      .img-miss {
        color: #f87171;
      }
      pre#log {
        background: #0f0f11;
        padding: 12px;
        border-radius: 8px;
        overflow: auto;
        font-size: 12px;
        min-height: 60px;
        white-space: pre-wrap;
        color: #d4d4d8;
      }
      a {
        color: #60a5fa;
      }
      #repo {
        font-size: 12px;
        color: #a1a1aa;
        margin-bottom: 16px;
      }
      #repo a {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>文章部署器</h1>
    <p class="muted">
      选择包含 .md 文章（及文中引用图片）的文件夹 → 勾选 →
      部署。发布后自动提交推送并触发博客构建。
    </p>
    <p id="repo"></p>
    <p>
      <button id="pick">① 选择文章文件夹</button>
      <span id="dirname" class="muted"></span>
    </p>
    <div id="list"></div>
    <p>
      <button id="deploy" class="primary" disabled>② 部署选中的文章</button>
    </p>
    <pre id="log"></pre>
    <p id="result"></p>
    <script src="./renderer.js"></script>
  </body>
</html>
